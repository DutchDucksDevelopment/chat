name: Build and Deploy
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace PubNub keys
        run: |
          # Replace in index.html
          sed -i "s/PUBNUB_PUBLISH_KEY_PLACEHOLDER/${{ secrets.PUBNUB_PUBLISH_KEY }}/g" index.html
          sed -i "s/PUBNUB_SUBSCRIBE_KEY_PLACEHOLDER/${{ secrets.PUBNUB_SUBSCRIBE_KEY }}/g" index.html

      - name: Deploy to GitHub Pages (or your host)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
