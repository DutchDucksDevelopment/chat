name: Build and Deploy
on: [push]

permissions:
  contents: write  # Required for pushing to gh-pages branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - Show app.js before
        run: cat js/app.js

      - name: Replace PubNub keys
        run: |
          # Replace in app.js
          sed -i "s/PUBNUB_PUBLISH_KEY_PLACEHOLDER/${{ secrets.PUBNUB_PUBLISH_KEY }}/g" js/app.js
          sed -i "s/PUBNUB_SUBSCRIBE_KEY_PLACEHOLDER/${{ secrets.PUBNUB_SUBSCRIBE_KEY }}/g" js/app.js

      - name: Debug - Show app.js after
        run: cat js/app.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
