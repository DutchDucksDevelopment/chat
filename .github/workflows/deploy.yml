name: Build and Deploy
on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - Show app.js before replacement
        run: echo "=== BEFORE ===" && cat js/app.js

      - name: Replace PubNub keys
        run: |
          sed -i "s/PUBNUB_PUBLISH_KEY_PLACEHOLDER/${{ secrets.PUBKEY }}/g" js/app.js
          sed -i "s/PUBNUB_SUBSCRIBE_KEY_PLACEHOLDER/${{ secrets.SUBKEY }}/g" js/app.js

      - name: Debug - Show app.js after replacement
        run: echo "=== AFTER ===" && cat js/app.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
