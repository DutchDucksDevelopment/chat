<html style="--force-dark-brightness: 100%; --force-dark-contrast: 126%; --force-dark-sepia: 0%;" class="pixel-ratio-1 watch-active-state theme-dark" data-force-dark-filter="true"><head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" sizes="32x32" href="img/logochat.png">
  <title>DDD chat</title>

  <!-- Scripts -->
  <script src="cordova.js"></script>
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.4.0.11.min.js"></script>
  <script src="js/lib/framework7.min.js"></script>
  <script src="js/lib/vue.min.js"></script>
  <script src="js/lib/framework7-vue.min.js"></script>
  <script src="js/app.js"></script>
  <!-- End scripts -->

  <!-- Styles -->
  <script>
    if (Framework7.prototype.device && Framework7.prototype.device.android) {
      document.write(
        '<link rel="stylesheet" href="css/framework7.material.min.css">' +
        '<link rel="stylesheet" href="css/framework7.material.colors.min.css">'
      );
    } else {
      document.write(
        '<link rel="stylesheet" href="css/framework7.ios.min.css">' +
        '<link rel="stylesheet" href="css/framework7.ios.colors.min.css">'
      );
    }
  </script><link rel="stylesheet" href="css/framework7.ios.min.css"><link rel="stylesheet" href="css/framework7.ios.colors.min.css"><link rel="stylesheet" href="css/framework7.ios.min.css"><link rel="stylesheet" href="css/framework7.ios.colors.min.css">
  <link rel="stylesheet" href="css/app2.css">
<style>
    :root {
      color-scheme: dark !important;
    }

    html {
      background-color: #121212 !important;
      filter: invert(0.92) hue-rotate(180deg) brightness(var(--force-dark-brightness, 100%)) contrast(var(--force-dark-contrast, 100%)) sepia(var(--force-dark-sepia, 0%)) !important;
    }

    /*
     * Known limitation: this unconditionally re-inverts every image/canvas
     * regardless of whether the site already inverted it itself (e.g. an
     * icon with a Tailwind "dark:invert" class driven by the real system
     * prefers-color-scheme). On those sites this double-inverts the icon
     * back to its original (now-invisible) color. See README's Theme
     * Engines section. No general fix without risking the common case this
     * rule exists for: un-inverting ordinary images on the vast majority
     * of sites that don't do their own conditional icon inversion.
     */
    img,
    video,
    canvas,
    picture,
    embed,
    object,
    [style*="background-image"] {
      filter: invert(1) hue-rotate(180deg) !important;
    }

    /* Prevent double inversion on media nested inside picture or video */
    picture img,
    picture video,
    video img {
      filter: none !important;
    }
  </style></head>

<body>
  <div id="app" class="framework7-root"><div class="statusbar-overlay"></div> <div class="views"><div class="view view-main navbar-through" id="main-view" data-page="null"><div class="navbar"> <div class="navbar-inner navbar-on-center"><div class="left sliding"><a href="#" class="back link"><i class="icon icon-back"></i><span class="">Back</span></a> </div> <!----> <div class="center sliding" id="title" style="left: -204px;">piracy</div></div> </div> <div class="pages"><div class="page page-on-center"><div class="page-content"><div class="content-block-title" id="nametitle">Name:</div> <div class="list-block" id="namediv"><ul><li class=""><div class="item-content"><div class="item-inner"><div class="item-input"><input type="text" placeholder="Your name" id="nameinput" value="DDD_Official"></div></div></div></li> <li id="enterbutton"><a href="#" class="item-link list-button">Enter chat</a></li></ul></div> <div class="content-block-title" id="roomtitle">Room:</div> <div class="list-block"><ul><li class=""><div class="item-content"><div class="item-inner"><div class="item-input"><input type="text" placeholder="Your room id" id="roominput"></div></div></div></li> <li id="joinbutton"><a href="#" class="item-link list-button">Join room</a></li></ul></div> <a href="#" class="button">Toggle stealth mode</a></div></div></div></div></div></div>

  <!-- Chat Page Template -->
  <template id="page-chat">
    <f7-page style="color: black" class="page-chat">
      <f7-messages>
        <f7-message v-for="(msg, idx) in msgs" :key="idx" :name="msg.name" :text="msg.text" :type="msg.type"></f7-message>
      </f7-messages>

      <!-- messagebar: keep submit handler and class to find textarea -->
      <f7-messagebar ref="msgbar" class="app-messagebar" placeholder="Message" send-link="Send" v-on:submit="messagebarSubmit"></f7-messagebar>
    </f7-page>
  </template>



</body></html>
